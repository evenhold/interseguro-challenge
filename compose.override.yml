services:
  api-go:
    build:
      context: ./api-go
      target: dev
    command: go run ./cmd/api
    volumes:
      - ./api-go:/app
    ports:
      - "3001:8080"
    env_file:
      - ./api-go/.env
    environment:
      - APP_ENV=development
    networks:
      - backend

  api-express:
    build:
      context: ./api-express
      target: dev
    command: node --watch --import tsx/esm src/server.ts
    volumes:
      - ./api-express:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    env_file:
      - ./api-express/.env
    environment:
      - PORT=3000
      - NODE_ENV=development
    networks:
      - backend

  web:
    build:
      context: ./web
      target: dev
      args:
        - NEXT_PUBLIC_API_GO_URL=http://localhost:3001
        - NEXT_PUBLIC_API_EXPRESS_URL=http://localhost:3002
    command: pnpm dev
    volumes:
      - ./web/src:/app/src
      - /app/.next
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env.local
    depends_on:
      - api-go
      - api-express
    networks:
      - backend

networks:
  backend:
    driver: bridge
